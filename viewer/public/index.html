<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Run Viewer</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
</head>
<body>
<header class="topbar">
  <strong>Claude × Codex Review</strong>
  <span class="muted">Review Run Viewer · read-only</span>
  <label class="work-item-picker">Work item <select id="work-item" aria-label="Work item"></select></label>
</header>
<div class="layout">
  <aside id="runs" class="runs" aria-label="Runs"></aside>
  <main id="main" class="main"><p class="muted pad">Loading…</p></main>
</div>
<script src="app.js"></script>
</body>
</html>
